<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة الولي | رعاية</title><link rel="stylesheet" href="styles.css"><style>
.parent-shell{max-width:1100px;margin:auto;padding:26px}.parent-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}.parent-brand{font-size:23px;font-weight:850;color:#172554}.parent-brand small{display:block;color:#7d899e;font-size:12px;font-weight:400;margin-top:5px}.parent-user{display:flex;align-items:center;gap:12px}.parent-user button{border:1px solid #dce3ed;background:white;border-radius:9px;padding:10px 14px}.parent-welcome{background:#172554;color:white;border-radius:18px;padding:28px;margin-bottom:22px}.parent-welcome p{color:#cbd5e1;line-height:1.9}.parent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.parent-panel{background:white;border:1px solid #e5eaf2;border-radius:15px;padding:22px;min-width:0}.parent-panel h2{font-size:17px;margin:0 0 16px}.record{padding:13px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:12px;align-items:center}.record:last-child{border-bottom:0}.record small{display:block;color:#7d899e;margin-top:5px}.empty-state{color:#7d899e;font-size:13px;line-height:1.9}.parent-alert{padding:12px;border-radius:10px;background:#fff7e6;color:#7a5310;font-size:13px;line-height:1.8;margin-bottom:16px}@media(max-width:700px){.parent-shell{padding:16px}.parent-grid{grid-template-columns:1fr}.parent-welcome{padding:22px}}
</style></head>
<body><main class="parent-shell"><header class="parent-head"><div class="parent-brand">رعاية<small>بوابة الولي</small></div><div class="parent-user"><span id="parentName">جارٍ تحميل الحساب…</span><button id="logoutBtn">تسجيل الخروج</button></div></header><section class="parent-welcome"><h1 id="welcomeTitle">مرحبًا بك</h1><p>من هنا يمكنك الاطلاع على ملفات أطفالك المسجلين لدى الحضانة ومتابعة بيانات الحضور والمدفوعات المتاحة لحسابك.</p></section><div id="alert" class="parent-alert" hidden></div><div class="parent-grid"><section class="parent-panel"><h2>أطفالي</h2><div id="children" class="empty-state">جارٍ تحميل البيانات…</div></section><section class="parent-panel"><h2>المدفوعات</h2><div id="payments" class="empty-state">جارٍ تحميل البيانات…</div></section></div></main><script>
let csrf='';
async function api(action,options={}){const r=await fetch('backend/api.php?action='+action,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){try{const me=await api('me');if(me.user.role!=='parent'){location.href='index.html';return}csrf=me.csrf;document.querySelector('#parentName').textContent=me.user.name;document.querySelector('#welcomeTitle').textContent='مرحبًا، '+me.user.name;const [c,p]=await Promise.all([api('children'),api('payments')]);document.querySelector('#children').innerHTML=c.children.length?c.children.map(x=>'<div class="record"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.group_name||'لم تحدد المجموعة')+(x.birth_date?' · '+esc(x.birth_date):'')+'</small></div></div>').join(''):'<p class="empty-state">لا توجد ملفات أطفال مرتبطة بحسابك حتى الآن. يرجى التواصل مع الإدارة.</p>';document.querySelector('#payments').innerHTML=p.payments.length?p.payments.map(x=>'<div class="record"><div><strong>'+esc(x.child_name)+'</strong><small>'+esc(x.payment_month)+'</small></div><div style="text-align:left"><strong>'+((Number(x.amount_cents)/100).toLocaleString('ar-DZ'))+' دج</strong><small>'+({'paid':'مدفوع','pending':'قيد المراجعة','rejected':'مرفوض'}[x.status]||esc(x.status))+'</small></div></div>').join(''):'<p class="empty-state">لا توجد مدفوعات مسجلة لهذا الحساب.</p>'}catch(e){if(e.message.includes('تسجيل الدخول'))location.href='login.html';else{const a=document.querySelector('#alert');a.hidden=false;a.textContent=e.message+' — تأكد من تشغيل الخادم وقاعدة البيانات.'}}}
document.querySelector('#logoutBtn').addEventListener('click',async()=>{try{await api('logout',{method:'POST',headers:{'X-CSRF-Token':csrf},body:'{}'})}finally{location.href='login.html'}});init();
</script></body></html>
